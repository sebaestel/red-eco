<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Revisión de marca — RED ECO</title>
<style>
  body { margin:0; padding:40px; background:#f8f7f1; font-family:-apple-system,system-ui,sans-serif; color:#172318; }
  h2 { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:#4a5850; margin:36px 0 12px; font-weight:600;}
  .fila { display:flex; align-items:flex-end; gap:28px; flex-wrap:wrap; }
  .oscuro { background:#10231a; padding:24px; display:inline-flex; align-items:center; gap:24px; border-radius:6px;}
  img.m16{width:16px} img.m24{width:24px} img.m32{width:32px}
  img.m48{width:48px} img.m80{width:80px} img.m160{width:160px} img.m260{width:260px}
  img.h240{width:240px} img.h420{width:420px}
  .swatches{display:flex;gap:0;border:1px solid rgba(16,35,26,.14);border-radius:4px;overflow:hidden}
  .sw{width:96px;height:72px;display:flex;align-items:flex-end;padding:6px;font-size:10px;font-family:ui-monospace,monospace}
</style>
</head>
<body>
  <h2>Marca sola — 16 / 24 / 32 / 48 / 80 / 160 / 260 px</h2>
  <div class="fila">
    <img class="m16" src="/public/logo-red-eco-marca.svg" alt="">
    <img class="m24" src="/public/logo-red-eco-marca.svg" alt="">
    <img class="m32" src="/public/logo-red-eco-marca.svg" alt="">
    <img class="m48" src="/public/logo-red-eco-marca.svg" alt="">
    <img class="m80" src="/public/logo-red-eco-marca.svg" alt="">
    <img class="m160" src="/public/logo-red-eco-marca.svg" alt="">
    <img class="m260" src="/public/logo-red-eco-marca.svg" alt="">
  </div>

  <h2>Favicon (app/icon.svg) — 16 / 32 / 80</h2>
  <div class="fila">
    <img class="m16" src="/src/app/icon.svg" alt="">
    <img class="m32" src="/src/app/icon.svg" alt="">
    <img class="m80" src="/src/app/icon.svg" alt="">
  </div>

  <h2>Lockup horizontal</h2>
  <div class="fila">
    <img class="h240" src="/public/logo-red-eco.svg" alt="">
    <img class="h420" src="/public/logo-red-eco.svg" alt="">
  </div>

  <h2>Sobre fondo pizarra</h2>
  <div class="oscuro">
    <img class="h420" src="/public/logo-red-eco-blanco.svg" alt="">
  </div>

  <h2>Paleta</h2>
  <div class="swatches">
    <div class="sw" style="background:#10231a;color:#f4f3ea">pizarra</div>
    <div class="sw" style="background:#1f6b45;color:#fff">bosque</div>
    <div class="sw" style="background:#7fb53f;color:#10231a">brote</div>
    <div class="sw" style="background:#23407e;color:#fff">tinta</div>
    <div class="sw" style="background:#c1976a;color:#10231a">greda</div>
    <div class="sw" style="background:#f8f7f1;color:#4a5850">papel</div>
  </div>
</body>
</html>
